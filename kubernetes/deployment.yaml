apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
spec:
  replicas: 2

  selector:
    matchLabels:
      app: platform-api

  template:
    metadata:
      labels:
        app: platform-api

    spec:
      containers:
        - name: platform-api
          image: kubernetes-platform-api
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi" 