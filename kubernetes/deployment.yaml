apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
spec:
  replicas: 2

  selector:
    matchLabels:
      app: platform-api

  template:
    metadata:
      labels:
        app: platform-api

    spec:
      containers:
        - name: platform-api
          image: kubernetes-platform-api
          imagePullPolicy: Never

          ports:
            - containerPort: 8000